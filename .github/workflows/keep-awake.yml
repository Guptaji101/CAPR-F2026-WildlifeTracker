# keep-awake.yml — keeps the free Render server awake and its cache warm.
#
# Render's free plan puts the website to sleep after about 15 minutes without visitors; the next
# visitor then waits about a minute. GitHub runs this job every 10 minutes (free for public
# repositories): it opens the website and the two requests every first visit makes (the default
# Busan search on the Map page and the Mammals list of the Encyclopedia), so they are already in
# the server's cache. GitHub may start a scheduled job a few minutes late, and it stops running
# scheduled jobs after 60 days without changes to the repository.
#
# To switch it off: GitHub → Actions → "Keep the website awake" → "..." → Disable workflow.
name: Keep the website awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # also lets you start it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open the website and the first searches
        run: |
          SITE=https://wildtrack-lq88.onrender.com
          curl -s -o /dev/null -w "Map page: %{http_code} in %{time_total}s\n" --max-time 90 "$SITE/"
          curl -s -o /dev/null -w "Busan search: %{http_code} in %{time_total}s\n" --max-time 60 \
            "$SITE/api/sightings.php?lat=35.1796&lng=129.0756&radius=10&limit=75"
          curl -s -o /dev/null -w "Mammals list: %{http_code} in %{time_total}s\n" --max-time 60 \
            "$SITE/api/encyclopedia.php?action=top&taxa=359&country=KR"
